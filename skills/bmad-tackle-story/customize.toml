# Customization surface for bmad-tackle-story.
# Plain config read directly by the skill (no BMAD resolver needed).
# Edit values here to tune the loop without touching SKILL.md.

[loop]
# Max dev→review→resolve iterations per story before STOP + report stall.
max_iter = 5

# A finding whose id survives this many consecutive review passes = stall.
stall_rounds = 2

# Process stories strictly in dependency order (true). Setting false allows
# parallel loops for stories the verified plan confirms independent — but
# each parallel story's coder/resolver subagents MUST then run with
# isolation = "worktree" (shared working tree corrupts concurrent diffs).
sequential = true

# Skip Step 1 plan verification (NOT recommended). When true, enter the
# loop directly — only for trivial stories with an already-verified plan.
skip_plan_verification = false

[models]
# Model alias pinned per lane (Agent tool `model` param). Aliases float to
# the latest model in each family — do not pin version numbers.
# The review gate runs INLINE in the main session (no model entry): its
# layer subagents inherit the session model.
plan_verify = "opus"
code        = "sonnet"
resolve     = "opus"

[validation]
# Default validation chain (Terraform). The skill MUST swap this for the
# stack-appropriate chain per _shared/load-rules.md when the story targets
# a different stack (Helm/Kustomize/app code/...).
chain = ["terraform fmt -recursive", "tflint -f compact", "checkov --config-file ../../.checkov.yml", "terraform validate"]

[scope]
# Outward-facing actions the orchestrator must NOT do without explicit user ask.
never_without_ask = ["git commit", "git push", "open PR", "terraform apply"]
